# dsh-opendesign-usage bundle patch: inserts its plugin row into the profile
# roster. The single row mounts BOTH halves: the host side (OpenDesign Go usage
# fetch, cookie login via Chrome/CDP, and /api/opendesign-usage JSON endpoints)
# and the browser side (the composer-dock usage pill, via the dsh.client
# declaration in package.json).
- insert:
    - id: opendesign-usage
      name: 'dsh-opendesign-usage'
